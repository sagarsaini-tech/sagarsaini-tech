<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="heroTitle heroDesc">
  <title id="heroTitle">Sagar Saini hero banner</title>
  <desc id="heroDesc">Premium burgundy hero illustration with gradients, technical grid, orbital geometry, and glowing accents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10070C"/>
      <stop offset="0.45" stop-color="#190B12"/>
      <stop offset="1" stop-color="#451126"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(920 90) rotate(90) scale(210 400)">
      <stop offset="0" stop-color="#C77B9B" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#701A3D" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="underline" x1="0" y1="0" x2="520" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E5B5C7" stop-opacity="0.2"/>
      <stop offset="0.3" stop-color="#F8F0F3"/>
      <stop offset="0.7" stop-color="#C77B9B"/>
      <stop offset="1" stop-color="#E5B5C7" stop-opacity="0.2"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" stroke="#F8F0F3" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <filter id="glowBlur" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style><![CDATA[
    .float { animation: float 10s ease-in-out infinite alternate; }
    .drift { animation: drift 16s ease-in-out infinite alternate; }
    .pulse { animation: pulse 4.5s ease-in-out infinite; }
    .scan { animation: scan 9s linear infinite; }
    @keyframes float {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-9px); }
    }
    @keyframes drift {
      0% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(10px, -8px) scale(1.02); }
      100% { transform: translate(-8px, 7px) scale(0.98); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    @keyframes scan {
      0% { transform: translateX(-20px); opacity: 0.2; }
      50% { opacity: 0.7; }
      100% { transform: translateX(18px); opacity: 0.2; }
    }
  ]]></style>

  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)" opacity="0.8"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <g opacity="0.7" class="float">
    <circle cx="961" cy="72" r="118" stroke="#E5B5C7" stroke-opacity="0.27" stroke-width="1.2" fill="none"/>
    <circle cx="961" cy="72" r="156" stroke="#C77B9B" stroke-opacity="0.2" stroke-width="1" fill="none"/>
    <circle cx="961" cy="72" r="196" stroke="#F8F0F3" stroke-opacity="0.1" stroke-width="1" fill="none"/>
    <path d="M961 72L1084 72" stroke="#F8F0F3" stroke-opacity="0.35" stroke-width="1"/>
    <path d="M961 72L906 167" stroke="#F8F0F3" stroke-opacity="0.2" stroke-width="1"/>
    <path d="M962 72L878 42" stroke="#F8F0F3" stroke-opacity="0.2" stroke-width="1"/>
  </g>

  <g class="drift" opacity="0.6">
    <rect x="708" y="170" width="290" height="112" rx="20" fill="#F8F0F3" fill-opacity="0.03" stroke="#F8F0F3" stroke-opacity="0.16"/>
    <path d="M748 252H968" stroke="#E5B5C7" stroke-opacity="0.32" stroke-width="1.2"/>
    <path d="M748 212H912" stroke="#E5B5C7" stroke-opacity="0.2" stroke-width="1.2"/>
    <path d="M748 230H888" stroke="#E5B5C7" stroke-opacity="0.17" stroke-width="1.2"/>
    <circle cx="733" cy="185" r="5" fill="#C77B9B" filter="url(#glowBlur)"/>
    <circle cx="756" cy="185" r="5" fill="#E5B5C7" fill-opacity="0.7"/>
    <circle cx="779" cy="185" r="5" fill="#F8F0F3" fill-opacity="0.55"/>
  </g>

  <g class="scan" opacity="0.8">
    <rect x="80" y="90" width="360" height="2" fill="url(#underline)" opacity="0.8"/>
  </g>

  <g>
    <text x="90" y="178" fill="#F8F0F3" font-family="Segoe UI, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="4" textLength="470" lengthAdjust="spacingAndGlyphs">SAGAR SAINI</text>
    <rect x="90" y="198" width="440" height="4" rx="2" fill="url(#underline)" filter="url(#glowBlur)"/>
    <text x="90" y="250" fill="#C77B9B" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="500" letter-spacing="2.3">WEB DEVELOPER | AI AUTOMATION | WEB TECHNOLOGIES</text>
  </g>

  <g opacity="0.5">
    <path d="M1016 254C1046 214 1094 201 1142 216" stroke="#E5B5C7" stroke-width="1.4" stroke-linecap="round"/>
    <path d="M1016 254C1059 270 1108 275 1152 264" stroke="#F8F0F3" stroke-opacity="0.28" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
